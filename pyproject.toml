[tool.black]
line-length = 120
target-version = ['py312']

[tool.ruff]
line-length = 120
target-version = 'py312'

[tool.ruff.lint]
select = ['E','F','I','UP','B','SIM']
ignore = ['B008']

[tool.mypy]
python_version = '3.12'
plugins = []
strict = false
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
